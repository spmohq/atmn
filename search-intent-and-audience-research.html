<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search Intent And Audience Research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 25px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-label {
      display: block;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .dynamic-textarea {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      min-height: 120px;
      resize: vertical;
      margin-bottom: 10px;
      transition: all 0.3s;
    }

    .dynamic-textarea:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.1);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 30px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.95rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 25px;
      line-height: 1.6;
      word-break: break-word;
    }

    .button-group {
      display: flex;
      gap: 15px;
      flex-direction: column;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.6rem; }
      .step-card { padding: 25px; }
      .prompt-content { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Search Intent And Audience Research</h1>
    </header>

    <div class="prompt-workflow">
      
      <!-- Input Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Data Input</span>
        </div>
        <label class="input-label" for="keywordInput">Paste keyword</label>
        <textarea 
          id="keywordInput" 
          class="dynamic-textarea" 
          placeholder="Type or paste your keywords here..."
          oninput="updatePrompts()"></textarea>
      </div>

      <!-- Prompt #1 Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Prompt #1</span>
        </div>
        <div class="prompt-content" id="p1"></div>
        <div class="button-group">
          <button class="btn copy-btn" onclick="copyText('p1', this)">
            <span>Copy Prompt #1</span>
          </button>
        </div>
      </div>

      <!-- Prompt #2 Card -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Prompt #2</span>
        </div>
        <div class="prompt-content" id="p2"></div>
        <div class="button-group">
          <button class="btn copy-btn" onclick="copyText('p2', this)">
            <span>Copy Prompt #2</span>
          </button>
        </div>
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const template1 = `Act as a search intent and audience research expert. 
Analyze the following search keyword(s) and infer the searcher's mindset. 
Present your answer in a table with the following columns:

Search Keyword
Underlying Need (What problem, pain, desire, or aspiration is driving the search?)
Search Intent (What is the searcher trying to achieve right now?)
Awareness Level (Unaware, Problem-Aware, Solution-Aware, Product-Aware, or Most-Aware. Explain why.)
Desired Outcome (What end result or transformation is the searcher hoping for?)
Reasoning (Briefly explain how you inferred the above from the keyword.)

Keyword(s): 
[Paste keyword]`;

    const template2 = `Answer the following prompt in Bengali (India).

Rules:
- Use only Bengali (India).
- Always address the reader as "আপনি".
- Never use "তুমি" or "তুই".
- Use a natural Kolkata-style conversational tone.
- Use natural, modern Bengali (India).
- Avoid Bangladeshi vocabulary, spelling, and expressions.

PROMPT:

Act as a search intent and audience research expert. 
Analyze the following search keyword(s) and infer the searcher's mindset. 
Present your answer in a table with the following columns:

Search Keyword
Underlying Need (What problem, pain, desire, or aspiration is driving the search?)
Search Intent (What is the searcher trying to achieve right now?)
Awareness Level (Unaware, Problem-Aware, Solution-Aware, Product-Aware, or Most-Aware. Explain why.)
Desired Outcome (What end result or transformation is the searcher hoping for?)
Reasoning (Briefly explain how you inferred the above from the keyword.)

Keyword(s): 
[Paste keyword]`;

    function updatePrompts() {
      const userInput = document.getElementById('keywordInput').value || '[Paste keyword]';
      
      const filledP1 = template1.replace('[Paste keyword]', userInput);
      const filledP2 = template2.replace('[Paste keyword]', userInput);
      
      document.getElementById('p1').innerText = filledP1;
      document.getElementById('p2').innerText = filledP2;
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize display on load
    window.onload = updatePrompts;
  </script>
</body>
</html>
